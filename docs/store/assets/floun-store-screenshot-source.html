<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Floun Chrome Web Store artwork</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; }
      body {
        background: linear-gradient(135deg, #fbf6ea 0%, #f3ead5 100%);
        color: #123f47;
        font-family: "Noto Sans", Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        display: grid;
        grid-template-columns: 1fr 432px;
        gap: 96px;
        height: 100%;
        padding: 84px 96px 84px 72px;
      }
      .copy { display: flex; flex-direction: column; justify-content: space-between; }
      .wordmark { margin: 0; color: #0f6a6c; font-size: 88px; font-weight: 800; letter-spacing: -3px; line-height: 1; }
      h1 { margin: 0; color: #1c3b3d; font-size: 48px; line-height: 1.25; letter-spacing: -0.5px; }
      h1 span { display: block; color: #0f6a6c; }
      ul { margin: 0; padding: 0; list-style: none; color: #4d6a6a; font-size: 24px; line-height: 1.9; }
      .footer { color: #0f6a6c; font-size: 20px; font-weight: 700; }
      .product-frame {
        align-self: center;
        width: 432px;
        height: 632px;
        padding: 16px;
        border: 1px solid rgba(15, 106, 108, 0.22);
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 30px 70px rgba(17, 72, 80, 0.18), 0 8px 22px rgba(17, 72, 80, 0.12);
      }
      .product-frame img { display: block; width: 400px; height: 600px; }
    </style>
  </head>
  <body>
    <main>
      <section class="copy">
        <p class="wordmark">floun</p>
        <h1>Crypto readiness,<span>clearly mapped.</span></h1>
        <ul>
          <li>Scan the current site locally.</li>
          <li>Understand migration signals.</li>
          <li>Export a redacted report.</li>
        </ul>
        <div class="footer">v3 &middot; Built with Teal</div>
      </section>
      <section class="product-frame" aria-label="Floun scanning a site">
        <img src="./floun-popup-cloudflare.png" alt="Floun scan results" />
      </section>
    </main>
  </body>
</html>
