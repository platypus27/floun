name: Publish release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: floun/package-lock.json
      - id: version
        name: Verify version tag
        shell: bash
        run: |
          VERSION="$(node -p "require('./floun/package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
          test -f "docs/RELEASE_NOTES_${VERSION}.md"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
      - name: Verify signed annotated tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_TYPE="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq '.object.type')"
          TAG_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq '.object.sha')"
          test "${TAG_TYPE}" = "tag"
          VERIFIED="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_SHA}" --jq '.verification.verified')"
          test "${VERIFIED}" = "true"
      - name: Install dependencies
        run: npm ci --prefix floun
      - name: Run publication gate
        run: npm run release:publish:check --prefix floun
      - name: Generate checksum
        shell: bash
        run: |
          sha256sum "floun/release/floun-${{ steps.version.outputs.version }}.zip" \
            > "floun/release/floun-${{ steps.version.outputs.version }}.zip.sha256"
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              "floun/release/floun-${VERSION}.zip" \
              "floun/release/floun-${VERSION}.zip.sha256" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              "floun/release/floun-${VERSION}.zip" \
              "floun/release/floun-${VERSION}.zip.sha256" \
              --verify-tag \
              --title "Floun ${VERSION}" \
              --notes-file "docs/RELEASE_NOTES_${VERSION}.md"
          fi
